  embedded_official_host:
    cs-host|contains:
      - 'steamcommunity.com.'
      - 'steamgames.com.'
      - 'steampowered.com.'
      - 'steamstatic.com.'
      - 'valvesoftware.com.'
  embedded_official_label:
    cs-host|contains:
      - 'steamcommunity'
      - 'steamgames'
      - 'steampowered'
      - 'steamstatic'
      - 'valvesoftware'
  official_host:
    cs-host|endswith:
      - 'steamcommunity.com'
      - 'steamgames.com'
      - 'steampowered.com'
      - 'steamstatic.com'
      - 'valvesoftware.com'
  condition: (lookalike_host or embedded_official_host or embedded_official_label) and not official_host
falsepositives:
  - Steam brand-protection domains that Valve registers defensively and then
    redirects. Confirm ownership before tuning one out.
  - Fan sites and wikis whose hostname contains a Steam brand label. The
    extension suppresses these with a credential-field check that a proxy log
    cannot reproduce, so they surface here and the browser stays quiet.
level: high
