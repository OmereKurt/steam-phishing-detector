name: CI

on:
  push:
  pull_request:

jobs:
  scoring:
    name: Scoring engine
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify the extension copy of the scorer is in sync
        run: npm run sync:check

      - name: Verify generated detection content is in sync
        run: npm run detections:check

      - name: Run unit and corpus tests
        run: npm test

      - name: Report detection performance
        run: npm run eval:misses
